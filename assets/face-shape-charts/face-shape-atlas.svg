="middle">Wider forehead; narrow chin</text><text x="415" y="839" font-size="17" font-weight="400" text-anchor="middle">Compare forehead with cheeks</text><rect x="627" y="529" width="348" height="352" rx="22" fill="#fff" stroke="#eadce7"/><g transform="translate(700 541) scale(0.84)"><path d="M120 23C94 23 80 42 69 65L48 109C57 137 84 161 120 197C156 161 183 137 192 109L171 65C160 42 146 23 120 23Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><text x="801" y="765" font-size="29" font-weight="700" text-anchor="middle">Diamond</text><text x="801" y="807" font-size="19" font-weight="400" text-anchor="middle">Widest at the cheeks</text><text x="801" y="839" font-size="17" font-weight="400" text-anchor="middle">Narrower forehead and jaw</text><rect x="1013" y="529" width="348" height="352" rx="22" fill="#fff" stroke="#eadce7"/><g transform="translate(1086 541) scale(0.84)"><path d="M120 27C86 27 71 49 70 80L53 143C49 165 68 182 96 191Q120 199 144 191C172 182 191 165 187 143L170 80C169 49 154 27 120 27Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><text x="1187" y="765" font-size="29" font-weight="700" text-anchor="middle">Triangle</text><text x="1187" y="807" font-size="19" font-weight="400" text-anchor="middle">Jaw wider than forehead</text><text x="1187" y="839" font-size="17" font-weight="400" text-anchor="middle">More width in the lower outline</text><text x="48" y="921" font-size="20" font-weight="400" >These are styling profiles, not population categories. Reference values belong to this tool's classifier.</text><text x="48" y="958" font-size="20" font-weight="600" >Tool Genie · Original illustration · Version 1 · September 14, 2026</text><text x="48" y="989" font-size="19" font-weight="400" >