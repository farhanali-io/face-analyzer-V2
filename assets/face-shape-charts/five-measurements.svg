<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="992" viewBox="0 0 1600 992" role="img" aria-labelledby="title"><title id="title">How AI Measures Face Shape</title><rect width="100%" height="100%" fill="#fffafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#302934"><text x="48" y="70" font-size="46" font-weight="700" >How AI Measures Face Shape</text><text x="48" y="112" font-size="25" font-weight="400" >Three width ratios and two contour angles — all from visible landmarks</text><g transform="translate(100 176) scale(2.6)"><path d="M120 24C73 24 57 56 60 105C63 151 89 192 120 197C151 192 177 151 180 105C183 56 167 24 120 24Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><g transform="translate(100 176) scale(2.6)" fill="none" stroke-width="1.5"><path d="M67 64H173M60 110H181M76 155H164M209 24V197M203 24h12M203 197h12" stroke="#6b62ab" stroke-dasharray="4 3"/><path d="M60 110L76 155L120 197L164 155L181 110" stroke="#bc5d72"/><path d="M73 145Q82 146 87 164M109 187Q120 178 131 187" stroke="#bc5d72" stroke-width="2.3"/><g fill="#6b62ab" stroke="none"><circle cx="67" cy="64" r="2.4"/><circle cx="173" cy="64" r="2.4"/><circle cx="60" cy="110" r="2.4"/><circle cx="181" cy="110" r="2.4"/><circle cx="76" cy="155" r="2.4"/><circle cx="164" cy="155" r="2.4"/><circle cx="120" cy="197" r="2.4"/></g></g><text x="48" y="333" font-size="20" font-weight="600" >Forehead</text><text x="48" y="359" font-size="20" font-weight="600" >width</text><text x="48" y="452" font-size="20" font-weight="600" >Cheek</text><text x="48" y="478" font-size="20" font-weight="600" >width</text><text x="48" y="569" font-size="20" font-weight="600" >Jaw</text><text x="48" y="595" font-size="20" font-weight="600" >width</text><text x="668" y="411" font-size="20" font-weight="600" >Visible</text><text x="668" y="438" font-size="20" font-weight="600" >length</text><text x="785" y="236" font-size="27" font-weight="700" >1. Length / cheek width</text><text x="785" y="272" font-size="20" font-weight="400" >Visible upper forehead to chin, divided by cheek width.</text><text x="785" y="334" font-size="27" font-weight="700" >2. Forehead / cheek width</text><text x="785" y="370" font-size="20" font-weight="400" >Temple-level width compared with cheek width.</text><text x="785" y="432" font-size="27" font-weight="700" >3. Jaw / cheek width</text><text x="785" y="468" font-size="20" font-weight="400" >Width between jaw corners, divided by cheek width.</text><text x="785" y="530" font-size="27" font-weight="700" >4. Jaw corner angle</text><text x="785" y="566" font-size="20" font-weight="400" >Mean of the left and right cheek–corner–chin angles.</text><text x="785" y="628" font-size="27" font-weight="700" >5. Chin taper angle</text><text x="785" y="664" font-size="20" font-weight="400" >The angle between the jaw corners at the chin.</text><text x="48" y="779" font-size="22" font-weight="600" >Purple: lengths used to calculate ratios. Rose: jaw and chin angles.</text><text x="48" y="824" font-size="21" font-weight="400" >The mesh does not locate the true hairline. Manual and photo measurements are not interchangeable.</text><text x="48" y="862" font-size="20" font-weight="400" >Schematic positions are illustrative; pose, hair and camera perspective can change the detected contour.</text><text x="48" y="924" font-size="20" font-weight="600" >Tool Genie · Original illustration · Version 1 · September 14, 2026</text><text x="48" y="955" font-size="19" font-weight="400" >Source: www.toolgenie.online/face-shapes#five-measurements · Reuse with attribution</text></g></svg>