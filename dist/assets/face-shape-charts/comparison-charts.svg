<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title"><title id="title">Compare Similar Face Shapes</title><rect width="100%" height="100%" fill="#fffafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#302934"><text x="48" y="70" font-size="46" font-weight="700" >Compare Similar Face Shapes</text><text x="48" y="112" font-size="25" font-weight="400" >Start with the feature that differs, then compare both profiles.</text><rect x="48" y="152" width="1504" height="252" rx="22" fill="#fff" stroke="#eadce7"/><g transform="translate(78 158) scale(0.83)"><path d="M120 34C75 34 48 65 49 109C50 155 82 188 120 188C158 188 190 155 191 109C192 65 165 34 120 34Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><g transform="translate(325 158) scale(0.83)"><path d="M120 32C78 32 55 48 54 88L57 153Q60 175 84 181L108 189Q120 193 132 189L156 181Q180 175 183 153L186 88C185 48 162 32 120 32Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><text x="178" y="374" font-size="22" font-weight="600" text-anchor="middle">Round</text><text x="425" y="374" font-size="22" font-weight="600" text-anchor="middle">Square</text><text x="603" y="207" font-size="32" font-weight="700" >Round vs Square</text><text x="603" y="258" font-size="21" font-weight="400" >Both can be short and wide. Check the jaw corner.</text><text x="603" y="298" font-size="21" font-weight="400" >Round curves through the corner; square has a sharper turn.</text><text x="603" y="338" font-size="21" font-weight="400" >Width ratios alone cannot reliably separate these two profiles.</text><rect x="48" y="428" width="1504" height="252" rx="22" fill="#fff" stroke="#eadce7"/><g transform="translate(78 434) scale(0.83)"><path d="M120 24C73 24 57 56 60 105C63 151 89 192 120 197C151 192 177 151 180 105C183 56 167 24 120 24Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><g transform="translate(325 434) scale(0.83)"><path d="M120 15C77 15 61 42 61 82L62 139C65 180 91 209 120 211C149 209 175 180 178 139L179 82C179 42 163 15 120 15Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><text x="178" y="650" font-size="22" font-weight="600" text-anchor="middle">Oval</text><text x="425" y="650" font-size="22" font-weight="600" text-anchor="middle">Oblong</text><text x="603" y="483" font-size="32" font-weight="700" >Oval vs Oblong</text><text x="603" y="534" font-size="21" font-weight="400" >Compare face length relative to cheek width.</text><text x="603" y="574" font-size="21" font-weight="400" >This tool uses 1.44 for oval and 1.64 for oblong reference profiles.</text><text x="603" y="614" font-size="21" font-weight="400" >These are reference points, not hard cutoffs or population norms.</text><rect x="48" y="704" width="1504" height="252" rx="22" fill="#fff" stroke="#eadce7"/><g transform="translate(78 710) scale(0.83)"><path d="M120 30C82 13 48 42 52 86C56 131 89 172 120 199C151 172 184 131 188 86C192 42 158 13 120 30Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><g transform="translate(325 710) scale(0.83)"><path d="M120 23C94 23 80 42 69 65L48 109C57 137 84 161 120 197C156 161 183 137 192 109L171 65C160 42 146 23 120 23Z" fill="#f4deea" stroke="#9c5d80" stroke-width="2.4"/><path d="M77 95q14-11 29 0m28 0q14-11 29 0M120 103l-5 26h11M104 153q16 8 32 0" fill="none" stroke="#795365" stroke-width="2"/></g><text x="178" y="926" font-size="22" font-weight="600" text-anchor="middle">Heart</text><text x="425" y="926" font-size="22" font-weight="600" text-anchor="middle">Diamond</text><text x="603" y="759" font-size="32" font-weight="700" >Heart vs Diamond</text><text x="603" y="810" font-size="21" font-weight="400" >Compare the forehead with the cheeks.</text><text x="603" y="850" font-size="21" font-weight="400" >Heart has a wider forehead; diamond is widest at the cheeks.</text><text x="603" y="890" font-size="21" font-weight="400" >Both may have a tapered chin. Hair can hide the useful width cues.</text><text x="48" y="1018" font-size="20" font-weight="600" >Tool Genie · Original illustration · Version 1 · September 14, 2026</text><text x="48" y="1049" font-size="19" font-weight="400" >Source: www.toolgenie.online/face-shapes#comparison-charts · Reuse with attribution</text></g></svg>